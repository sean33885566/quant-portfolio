<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230"><rect width="1000" height="230" fill="white"/><g font-family="Microsoft JhengHei,sans-serif" fill="#213e3a"><text x="20" y="30" font-size="23">資料可得性：實際資訊與代理規則</text><rect x="20" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="110" y="103" text-anchor="middle" font-size="15">交易／財務資料</text><text x="110" y="132" text-anchor="middle" font-size="12">來源及資料事件</text><rect x="214" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="304" y="103" text-anchor="middle" font-size="15">可得性規則</text><text x="304" y="132" text-anchor="middle" font-size="12">公告／上傳或期限代理</text><rect x="408" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="498" y="103" text-anchor="middle" font-size="15">對齊研究面板</text><text x="498" y="132" text-anchor="middle" font-size="12">保留來源與規則</text><rect x="602" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="692" y="103" text-anchor="middle" font-size="15">特徵轉換</text><text x="692" y="132" text-anchor="middle" font-size="12">依各步驟時序限制</text><rect x="796" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="886" y="103" text-anchor="middle" font-size="15">模型與驗證</text><text x="886" y="132" text-anchor="middle" font-size="12">標籤成熟檢查</text><text x="20" y="210" font-size="14">仍有歷史修訂版本與發布時刻等待查核項目；非所有來源完整 PIT 認證。</text></g></svg>