<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230"><rect width="1000" height="230" fill="white"/><g font-family="Microsoft JhengHei,sans-serif" fill="#213e3a"><text x="20" y="30" font-size="23">舊 Tick 執行假設；模型結果已因洩漏撤回</text><rect x="20" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="110" y="103" text-anchor="middle" font-size="15">訊號時間</text><text x="110" y="132" text-anchor="middle" font-size="12">模型輸入曾含未來欄位</text><rect x="214" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="304" y="103" text-anchor="middle" font-size="15">固定延遲</text><text x="304" y="132" text-anchor="middle" font-size="12">離線執行假設</text><rect x="408" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="498" y="103" text-anchor="middle" font-size="15">先前五檔快照</text><text x="498" y="132" text-anchor="middle" font-size="12">依深度模擬</text><rect x="602" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="692" y="103" text-anchor="middle" font-size="15">正常退出</text><text x="692" y="132" text-anchor="middle" font-size="12">離線帳戶處理</text><rect x="796" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="886" y="103" text-anchor="middle" font-size="15">強制退出</text><text x="886" y="132" text-anchor="middle" font-size="12">代理價格及成本懲罰</text><text x="20" y="210" font-size="14">非交易所實際撮合；執行限制或帳戶對帳不能修復上游 exit_staleness_sec 洩漏。</text></g></svg>