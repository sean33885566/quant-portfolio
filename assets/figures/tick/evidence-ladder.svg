<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230"><rect width="1000" height="230" fill="white"/><g font-family="Microsoft JhengHei,sans-serif" fill="#213e3a"><text x="20" y="30" font-size="23">Tick 舊版證據的失效邊界</text><rect x="20" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="110" y="103" text-anchor="middle" font-size="15">資料處理</text><text x="110" y="132" text-anchor="middle" font-size="12">工程實作可留</text><rect x="214" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="304" y="103" text-anchor="middle" font-size="15">V3／R1 特徵</text><text x="304" y="132" text-anchor="middle" font-size="12">發現未來資訊</text><rect x="408" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="498" y="103" text-anchor="middle" font-size="15">預測結論</text><text x="498" y="132" text-anchor="middle" font-size="12">撤回</text><rect x="602" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="692" y="103" text-anchor="middle" font-size="15">帳戶推論</text><text x="692" y="132" text-anchor="middle" font-size="12">不得作有效績效</text><rect x="796" y="65" width="180" height="100" rx="8" fill="#eff5f4" stroke="#2f6f6a"/><text x="886" y="103" text-anchor="middle" font-size="15">後續版本</text><text x="886" y="132" text-anchor="middle" font-size="12">須獨立驗收</text><text x="20" y="210" font-size="14">不以後續版本、時間切分或信賴區間替受污染結果背書。</text></g></svg>